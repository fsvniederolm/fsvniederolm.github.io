<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein FSV – Eigenes Passwort festlegen</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e131a;color:#f6f8fa;font:16px system-ui,sans-serif}main{width:min(440px,calc(100% - 28px));background:#19222d;border:1px solid #46515d;border-radius:20px;padding:28px}input,button{width:100%;padding:13px;border-radius:10px;font:inherit;margin:7px 0 16px}input{background:#101820;border:1px solid #647384;color:#fff}button{border:0;background:#b51a2d;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}small{color:#c2cad5}#msg{color:#ffd18b}</style></head><body><main><h1>Eigenes Passwort festlegen</h1><p>Bevor du Mein FSV nutzt, musst du dein Startpasswort ersetzen.</p><form id="form"><label for="pw">Neues Passwort</label><input id="pw" type="password" autocomplete="new-password" minlength="8" required><label for="again">Passwort wiederholen</label><input id="again" type="password" autocomplete="new-password" minlength="8" required><small>Mindestens 8 Zeichen, ein Großbuchstabe und ein Sonderzeichen.</small><button id="save">Passwort speichern</button></form><p id="msg" role="alert"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const sb=window.supabase.createClient('https://ibhtvjaawinpcwvbwzct.supabase.co','sb_publishable_omPVDjNvHQ5SULxKhJQqUA_-rCJ0PL3',{auth:{persistSession:true,autoRefreshToken:true}});
(async()=>{const {data:{user}}=await sb.auth.getUser();if(!user){location.replace('mein-fsv-login.html');return}const {data,error}=await sb.from('mein_fsv_users').select('active,must_change_password').eq('id',user.id).single();if(error||!data?.active){await sb.auth.signOut();location.replace('mein-fsv-login.html');return}if(!data.must_change_password)location.replace('mein-fsv.html')})();
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');const b=document.getElementById('save');const p=document.getElementById('pw').value;if(p!==document.getElementById('again').value){msg.textContent='Die Passwörter stimmen nicht überein.';return}if(p.length<8||!/[A-Z]/.test(p)||!/[^a-zA-Z0-9]/.test(p)){msg.textContent='Mindestens 8 Zeichen, ein Großbuchstabe und ein Sonderzeichen erforderlich.';return}b.disabled=true;msg.textContent='Passwort wird gespeichert …';try{const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Sitzung abgelaufen. Bitte erneut anmelden.');const r=await fetch('https://ibhtvjaawinpcwvbwzct.supabase.co/functions/v1/trainer-admin',{method:'POST',headers:{'Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_omPVDjNvHQ5SULxKhJQqUA_-rCJ0PL3','Content-Type':'application/json'},body:JSON.stringify({action:'change_own_password',password:p})});const d=await r.json();if(!r.ok)throw Error(d.error||'Passwortwechsel fehlgeschlagen');document.getElementById('pw').value='';document.getElementById('again').value='';await sb.auth.signOut();location.replace('mein-fsv-login.html');}catch(err){msg.textContent=err.message}finally{b.disabled=false}};
</script></body></html>
