<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein FSV – Einladung</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e131a;color:#f6f8fa;font:16px system-ui,sans-serif}main{width:min(450px,calc(100% - 28px));background:#19222d;border:1px solid #46515d;border-radius:20px;padding:28px}h1{margin-top:0}button{background:#b51a2d;border:0;border-radius:10px;color:white;font:inherit;font-weight:700;padding:14px;width:100%;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}#msg{color:#ffd18b;overflow-wrap:anywhere}a{color:#fff}</style></head><body><main><h1>⚽ Willkommen bei Mein FSV</h1><p>Aktiviere deinen persönlichen Trainerzugang. Anschließend legst du dein eigenes Passwort fest.</p><p id="msg" role="status">Einladung wird geprüft …</p><button id="activate" disabled>Zugang aktivieren</button><p><small>Dieser Link ist nur einmal verwendbar und 7 Tage gültig.</small></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const sb=window.supabase.createClient('https://ibhtvjaawinpcwvbwzct.supabase.co','sb_publishable_omPVDjNvHQ5SULxKhJQqUA_-rCJ0PL3',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const token=new URLSearchParams(location.hash.slice(1)).get('invite');history.replaceState(null,'',location.pathname);const msg=document.getElementById('msg');const btn=document.getElementById('activate');
if(!token||!/^[a-f0-9]{64}$/.test(token)){msg.textContent='Ungültiger Einladungslink. Bitte Vereinsverwaltung kontaktieren.'}else{msg.textContent='Deine Einladung ist bereit. Tippe auf „Zugang aktivieren“.';btn.disabled=false}
btn.onclick=async()=>{btn.disabled=true;msg.textContent='Zugang wird aktiviert …';try{const r=await fetch('https://ibhtvjaawinpcwvbwzct.supabase.co/functions/v1/trainer-admin',{method:'POST',headers:{'apikey':'sb_publishable_omPVDjNvHQ5SULxKhJQqUA_-rCJ0PL3','Content-Type':'application/json'},body:JSON.stringify({action:'redeem_invite',invite:token})});const d=await r.json();if(!r.ok)throw Error(d.error||'Aktivierung fehlgeschlagen');await sb.auth.signOut();const {error}=await sb.auth.setSession({access_token:d.access_token,refresh_token:d.refresh_token});if(error)throw error;location.replace('passwort-aendern.html')}catch(e){msg.textContent=e.message+' Bitte gegebenenfalls eine neue Einladung anfordern.'}};
</script></body></html>
