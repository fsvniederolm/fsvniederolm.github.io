name: FUSSBALL.DE Teamplan Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: pip install --disable-pip-version-check -r scripts/requirements-teamplan.txt
      - name: FUSSBALL.DE Spiele importieren
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fussball_import.py

      - name: HTML-Diagnose herunterladen ermöglichen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fussball-html-diagnose
          path: diagnose/
          if-no-files-found: warn
          retention-days: 3
