name: FUSSBALL.DE Ergebnis-Diagnose
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/ergebnis_diagnose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fussball-ergebnis-diagnose
          path: ergebnis-diagnose/
          if-no-files-found: warn
