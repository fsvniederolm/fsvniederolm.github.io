name: FUSSBALL.DE Schrift-Diagnose
on:
  workflow_dispatch:
jobs:
  font-diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/fussball_font_diagnose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fussball-schrift-diagnose
          path: font-diagnose/
          if-no-files-found: warn
