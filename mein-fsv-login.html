<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111820"><link rel="apple-touch-icon" href="fsv-wappen.png"><title>Mein FSV – Anmeldung</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#29303a,#0a0e13 65%);color:#fff;font:16px system-ui,Arial}main{width:min(420px,calc(100% - 28px));padding:34px;background:#151b23;border:1px solid #37404b;border-radius:24px;box-shadow:0 22px 80px #0008}img{width:88px;height:88px;object-fit:contain;display:block;margin:0 auto 12px}h1{text-align:center;margin:8px 0 4px}p{color:#b8c1ce;text-align:center;line-height:1.5}label{display:block;margin:17px 0 7px;font-weight:650}input{width:100%;padding:14px;border-radius:12px;background:#0c1219;color:#fff;border:1px solid #58616d;font:inherit}button{width:100%;border:0;background:#e30613;color:#fff;border-radius:12px;padding:15px;font:inherit;font-weight:800;cursor:pointer;margin-top:22px}button:disabled{opacity:.55}#message{min-height:24px;color:#ffc0c0;font-size:14px}small{color:#adb8c3;display:block;margin-top:16px;line-height:1.5}a{color:#fff}</style></head><body><main><img src="fsv-wappen.png" alt="FSV Nieder-Olm"><h1>Mein FSV</h1><p>Interner Zugang für Trainer und Verwaltung</p><form id="loginForm"><label for="username">Benutzername</label><input id="username" autocomplete="username" required pattern="[a-z0-9]+([.-][a-z0-9]+)+"><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Anmelden</button></form><p id="message" role="alert"></p><small>Keine öffentliche Registrierung. Dein Zugang wird von der Vereinsverwaltung eingerichtet. Die Anmeldung bleibt auf diesem Gerät gespeichert.</small></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const sb=window.supabase.createClient('https://ibhtvjaawinpcwvbwzct.supabase.co','sb_publishable_omPVDjNvHQ5SULxKhJQqUA_-rCJ0PL3',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const msg=document.getElementById('message');
let changeRequired=false;async function valid(){const {data:{user}}=await sb.auth.getUser();if(!user)return false;const {data,error}=await sb.from('mein_fsv_users').select('username,active,must_change_password').eq('id',user.id).maybeSingle();changeRequired=data?.must_change_password===true;return !error&&data?.active===true;}
(async()=>{try{if(await valid())location.replace(changeRequired?'passwort-aendern.html':'mein-fsv.html');}catch(e){}})();
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();msg.textContent='Anmeldung läuft …';const b=document.getElementById('submit');b.disabled=true;try{const username=document.getElementById('username').value.trim().toLowerCase();const password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email:(username==='ugur.altan'?'ugur.altan@outlook.de':username+'@mein-fsv.example.com'),password});document.getElementById('password').value='';if(error)throw Error('Benutzername oder Passwort falsch.');if(!await valid()){await sb.auth.signOut();throw Error('Dieser Zugang ist nicht freigeschaltet.');}location.replace(changeRequired?'passwort-aendern.html':'mein-fsv.html');}catch(err){msg.textContent=err.message}finally{b.disabled=false}};
</script></body></html>
